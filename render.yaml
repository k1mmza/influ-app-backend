# Render Blueprint — InfluApp backend — FREE-TIER SMOKE TEST ONLY
# ---------------------------------------------------------------------------
# ⚠️  THROWAWAY / TEST FILE. Do NOT use this for the real deploy — use
#     render.yaml for that. This variant exists only to bring the service up
#     cheaply to smoke-test the build/boot/health-check path.
#
# Differences vs. render.yaml (all four, so this actually runs card-free):
#   1. web service plan: starter → free
#   2. preDeployCommand removed — paid-only release phase, won't run on free.
#      Apply the pending migration MANUALLY first:  npx prisma migrate deploy
#   3. disk block removed — free web services don't support persistent disks
#      (paid instances only). Uploads are ephemeral for this test.
#   4. keyvalue (influ-app-redis) plan: starter → free.
#
# buildCommand, startCommand, and healthCheckPath match render.yaml. One envVar
# differs: UPLOAD_BASE_DIR is ./uploads here (relative, writable, ephemeral)
# instead of /data/uploads, since there's no mounted disk on free tier.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: influ-app-backend
    runtime: node
    branch: main
    plan: free                        # SMOKE TEST ONLY. Sleeps when idle; @Cron
                                      # schedulers and preDeployCommand are NOT
                                      # available on free. Do not ship this.
    autoDeploy: false                 # deploy manually after review (flip later if desired)
    region: oregon                    # pick the region nearest your Supabase project

    # Build the app. Mirrors the existing Dockerfile steps (install → generate → build).
    # The repo root IS the NestJS project, so commands run from there (no rootDir).
    buildCommand: npm install && npx prisma generate && npm run build

    # NOTE: preDeployCommand (npx prisma migrate deploy) is intentionally REMOVED
    # here — it's a paid-only release phase. Apply migrations manually before the
    # test (see header). The app itself does not run migrations at boot.

    startCommand: node dist/src/main.js

    # Render injects PORT automatically and the app reads process.env.PORT.
    # GET / returns 200 ("Hello World!"), so it serves as the health check.
    # (A dedicated /health endpoint would be cleaner but is a code change — not added.)
    healthCheckPath: /

    numInstances: 1                   # free tier is single-instance anyway

    # NOTE: no persistent `disk:` here — free web services don't support disks
    # (paid instances only). Uploads written under UPLOAD_BASE_DIR are EPHEMERAL
    # for this smoke test and vanish on restart/redeploy. That's fine for a
    # throwaway boot/health-check test. The real render.yaml keeps the disk.

    envVars:
      # --- Core (set in dashboard) -----------------------------------------
      - key: DATABASE_URL            # SECRET — Supabase pooled connection string (Prisma runtime)
        sync: false
      - key: DIRECT_URL              # SECRET — Supabase DIRECT (non-pooled, :5432) connection.
        sync: false                  #          Required for `prisma migrate deploy` (pooler can't run DDL).
      - key: JWT_SECRET              # SECRET — REQUIRED. Falls back to a hardcoded dev key if unset
        sync: false                  #          (silent + insecure). Set a strong random value.

      # --- Frontend / CORS --------------------------------------------------
      - key: FRONTEND_URL            # REQUIRED — your Vercel prod URL, e.g. https://influapp.vercel.app
        sync: false                  #            Used for CORS origin AND OAuth post-login redirects.

      # --- Redis / queue ----------------------------------------------------
      - key: REDIS_URL               # SECRET — REQUIRED. BullMQ connects at boot and jobs are enqueued
        fromService:                 #          on influencer views, so the app needs Redis in normal use.
          type: keyvalue             #          Wired from the Render Key Value instance below.
          name: influ-app-redis      #          (To use external Redis e.g. Upstash instead: delete this
          property: connectionString #           fromService block + the keyvalue service, and set sync:false.)

      # --- Uploads ----------------------------------------------------------
      - key: UPLOAD_BASE_DIR         # relative path — no disk on free tier. Writes go
        value: ./uploads             #       under the app's working dir; EPHEMERAL
                                     #       (vanish on restart/redeploy) but writable,
                                     #       so upload handlers won't crash. The real
                                     #       render.yaml uses /data/uploads (mounted disk).

      # --- Sync feature flags — PINNED OFF ---------------------------------
      # Deployment must NOT enable these. Verify the deploy, then flip in the
      # dashboard as a deliberate choice. Do not change the gating logic.
      - key: YOUTUBE_SYNC_ENABLED
        value: "false"
      - key: TIKTOK_SYNC_ENABLED
        value: "false"

      # --- AI (Smart Plan / analysis / smart search) -----------------------
      - key: ANTHROPIC_API_KEY       # SECRET — required for Smart Plan + AI search; feature-level
        sync: false                  #          failure (not boot) if missing.

      # --- Google login + YouTube connect ----------------------------------
      - key: GOOGLE_CLIENT_ID        # SECRET — Google OAuth + YouTube connect
        sync: false
      - key: GOOGLE_CLIENT_SECRET    # SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL     # e.g. https://<backend>.onrender.com/auth/google/callback
        sync: false
      - key: YOUTUBE_API_KEY         # SECRET — YouTube data fetch (connect + sync adapter; sync is OFF)
        sync: false
      - key: YOUTUBE_CONNECT_CALLBACK_URL  # e.g. https://<backend>.onrender.com/auth/youtube/connect/callback
        sync: false

      # --- Platform connect (TikTok / Instagram) ---------------------------
      - key: PLATFORM_CONNECT_CALLBACK_URL # e.g. https://<backend>.onrender.com/auth/platform/connect/callback
        sync: false
      - key: TIKTOK_CLIENT_KEY       # SECRET — only needed if TikTok connect is used
        sync: false
      - key: TIKTOK_CLIENT_SECRET    # SECRET
        sync: false
      - key: INSTAGRAM_APP_ID        # SECRET — only needed if Instagram connect is used
        sync: false
      - key: INSTAGRAM_APP_SECRET    # SECRET
        sync: false

      # --- Scraping + admin (optional now; sync flags are OFF) -------------
      - key: APIFY_API_TOKEN         # SECRET — TikTok/Instagram scrape adapters (sync only)
        sync: false
      - key: ADMIN_EMAILS            # comma-separated allowlist for the manual tracking-sync trigger
        sync: false

  # Render Key Value (managed Redis) backing the BullMQ queue. Declared as a
  # service (NOT under `databases:`, which is Postgres-only). Allowed by the
  # constraints — the prohibition is only on a Render-managed Postgres.
  # noeviction ensures queued jobs are never dropped under memory pressure.
  # Remove this entry if you point REDIS_URL at an external Redis instead.
  - type: keyvalue
    name: influ-app-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []   # internal-only access from the web service

# No Render-managed Postgres is declared — the app uses Supabase via DATABASE_URL.
